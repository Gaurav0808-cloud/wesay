name: WeSay Combined APK

on:
  push:
    branches: [codex/combined-apk]
    paths:
      - '.github/workflows/wesay-preview-apk.yaml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wesay-combined-apk
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Gaurav0808-cloud/wesay'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2'
    steps:
      - name: Check public repository and free storage headroom
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def get(path):
              return json.load(urllib.request.urlopen(urllib.request.Request('https://api.github.com/' + path, headers=headers)))
          if get('repos/' + repo)['private']:
              raise SystemExit('Only standard free public-repository builds are allowed')
          used = 0
          page = 1
          while True:
              items = get(f'repos/{repo}/actions/artifacts?per_page=100&page={page}')['artifacts']
              used += sum(a['size_in_bytes'] for a in items if not a['expired'])
              if len(items) < 100: break
              page += 1
          if used + 81000000 > 500000000:
              raise SystemExit('Not enough free storage headroom; wait for old artifacts to expire')
          print(f'Active repository artifact bytes: {used}; upload cap: 80000000 bytes')
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free unused runner space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/system-images
          df -h .
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          cache: false
      - name: Set up Rust for inherited Matrix encryption
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart
        run: flutter analyze --no-pub
      - name: Check WeSay, Knock and connection handling
        run: flutter test --no-pub test/wesay_test.dart test/knock_test.dart test/homeserver_probe_test.dart test/signup_preview_test.dart
      - name: Build compact ARM64 test APK
        run: flutter build apk --profile --target-platform android-arm64 --dart-define=WESAY_OFFLINE_PREVIEW=true --dart-define=WESAY_HOMESERVER=
      - name: Verify package and signature
        shell: python
        run: |
          import hashlib, os, re, shutil, subprocess
          from pathlib import Path
          source = Path('build/app/outputs/flutter-apk/app-profile.apk')
          if source.stat().st_size >= 80000000:
              raise SystemExit('APK exceeds conservative free-storage upload cap')
          sdk = Path(os.environ['ANDROID_HOME']) / 'build-tools'
          version = sorted((p for p in sdk.iterdir() if (p / 'aapt').exists() and (p / 'apksigner').exists()), key=lambda p: tuple(int(x) for x in re.findall(r'\d+', p.name)))[-1]
          badging = subprocess.check_output([str(version / 'aapt'), 'dump', 'badging', str(source)], text=True)
          package = next(l for l in badging.splitlines() if l.startswith('package:'))
          if not package.startswith("package: name='io.github.gaurav0808cloud.wesay.previewtest' "):
              raise SystemExit('Unexpected application ID; refusing to package')
          abi = next(l for l in badging.splitlines() if l.startswith('native-code:'))
          if abi.strip() != "native-code: 'arm64-v8a'":
              raise SystemExit('Unexpected native ABIs: ' + abi)
          signature = subprocess.check_output([str(version / 'apksigner'), 'verify', '--verbose', '--print-certs', str(source)], text=True)
          out = Path('dist'); out.mkdir(exist_ok=True)
          apk = out / 'WeSay-Combined-Test.apk'
          shutil.copy2(source, apk)
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          (out / 'SHA256SUMS.txt').write_text(f'{digest}  {apk.name}\n')
          (out / 'VERIFY.txt').write_text('Source: ' + os.environ['GITHUB_SHA'] + '\n' + package + '\n' + abi + '\n' + signature)
          print(package)
          print(abi)
          print(signature)
          print(f'APK bytes: {apk.stat().st_size}; SHA-256: {digest}')
      - name: Recheck free storage before upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def get(path):
              return json.load(urllib.request.urlopen(urllib.request.Request('https://api.github.com/' + path, headers=headers)))
          if get('repos/' + repo)['private']:
              raise SystemExit('Only standard free public-repository builds are allowed')
          used = 0
          page = 1
          while True:
              items = get(f'repos/{repo}/actions/artifacts?per_page=100&page={page}')['artifacts']
              used += sum(a['size_in_bytes'] for a in items if not a['expired'])
              if len(items) < 100: break
              page += 1
          if used + 81000000 > 500000000:
              raise SystemExit('Not enough free storage headroom; wait for old artifacts to expire')
          print(f'Active repository artifact bytes: {used}; upload cap: 80000000 bytes')
      - name: Upload combined test APK for one day
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wesay-combined-test-apk
          path: dist/
          retention-days: 1
          compression-level: 9
          if-no-files-found: error
