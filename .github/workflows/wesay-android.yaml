name: WeSay Android Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wesay-android.yaml'
      - 'lib/**'
      - 'android/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.fvmrc'
  push:
    branches: [main]
    paths:
      - '.github/workflows/wesay-android.yaml'
      - 'lib/**'
      - 'android/**'
      - 'test/wesay_test.dart'
      - 'test/knock_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.fvmrc'

permissions:
  contents: read

concurrency:
  group: wesay-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Gaurav0808-cloud/wesay'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free unused runner space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/system-images
          df -h .
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          cache: false
      - name: Set up Rust for inherited Matrix encryption
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Check WeSay defaults and logo
        run: flutter test --no-pub test/wesay_test.dart test/knock_test.dart
      - name: Prepare optional build configuration
        env:
          WESAY_HOMESERVER: ${{ github.event_name != 'pull_request' && secrets.WESAY_HOMESERVER || '' }}
        shell: python
        run: |
          import json, os
          from pathlib import Path
          from urllib.parse import urlsplit
          address = os.environ.get('WESAY_HOMESERVER', '').strip()
          if address:
              parsed = urlsplit(address)
              if parsed.scheme != 'https' or not parsed.hostname or parsed.username or parsed.password or parsed.query or parsed.fragment:
                  raise SystemExit('WESAY_HOMESERVER must be an HTTPS URL without credentials, query or fragment')
          path = Path(os.environ['RUNNER_TEMP']) / 'wesay-defines.json'
          path.write_text(json.dumps({'WESAY_HOMESERVER': address}))
          path.chmod(0o600)
      - name: Build ARM64 test APK
        run: flutter build apk --debug --target-platform android-arm64 --dart-define-from-file="$RUNNER_TEMP/wesay-defines.json"
      - name: Prepare download
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/wesay-test.apk
          # Stay below the free account's 500 MB artifact allowance for this run.
          test "$(stat -c%s dist/wesay-test.apk)" -lt 450000000
          cd dist
          sha256sum wesay-test.apk > SHA256SUMS.txt
      - name: Upload test APK for one day
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wesay-test-apk
          path: dist/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Remove build configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/wesay-defines.json"
